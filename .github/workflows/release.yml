name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:web
      # No Developer ID here: mac.identity "-" in package.json ad-hoc signs the
      # bundle, which Apple Silicon requires. Do NOT set
      # CSC_IDENTITY_AUTO_DISCOVERY=false — that skips signing altogether and
      # ships a bundle macOS reports as "damaged".
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            $(find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \)) \
            --repo "${GITHUB_REPOSITORY}" --clobber
